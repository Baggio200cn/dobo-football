name: 每周自动预测与复盘

on:
  schedule:
    # 北京时间 = UTC+8
    # 胜负彩近乎隔日开奖，不再按周跑。每次运行都做全套：
    #   auto_review  已开奖未复盘 → 结算
    #   fetch_onsale 发现新挂出的在售期次
    #   predict_any  在售且未出票 → 覆盖率够就出票，不够则拒绝并写明原因
    # 三者都幂等，多跑无害。
    - cron: '0 4  * * *'   # 每天 12:00 北京
    - cron: '0 13 * * *'   # 每天 21:00 北京
  workflow_dispatch:        # 允许手动触发
    inputs:
      task:
        description: '手动执行哪个任务'
        required: true
        default: 'review'
        type: choice
        options: [predict, review, both]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装中文字体（封面生成用）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 缓存比赛数据
        uses: actions/cache@v4
        with:
          path: engine/data
          key: fd-data-${{ github.run_id }}
          restore-keys: fd-data-

      - name: 判断任务类型
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.task }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            echo "kind=predict" >> $GITHUB_OUTPUT
          else
            echo "kind=review" >> $GITHUB_OUTPUT
          fi

      - name: 自动复盘（扫描未复盘期次，开奖即结算）
        working-directory: engine
        run: python auto_review.py

      - name: 更新中英队名对照表（自举，增量）
        working-directory: engine
        run: python build_teammap.py 40 || echo "对照表更新失败，沿用旧表"
        continue-on-error: true

      - name: 更新数据（36 联赛）
        working-directory: engine
        run: python -c "import data; data.update(refresh=True); m=data.load_matches(); print(f'{len(m)} 场 / {m.Div.nunique()} 联赛')"

      - name: 生成文章封面
        working-directory: engine
        run: python make_cover.py

      - name: 构建网站数据（含预测锁定 + 文章清单）
        working-directory: engine
        run: python build_web.py

      - name: 检查产出
        run: |
          ls -la site/ site/articles/ | head -20
          python engine/check_output.py
      - name: 提交变更
        run: |
          git config user.name  "dobo-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "🤖 自动更新 · ${{ steps.task.outputs.kind }} · $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 摘要
        run: |
          echo "### 🤖 自动运行完成" >> $GITHUB_STEP_SUMMARY
          echo "- 任务：${{ steps.task.outputs.kind }}" >> $GITHUB_STEP_SUMMARY
          echo "- 时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') (北京)" >> $GITHUB_STEP_SUMMARY
          echo "- 看板：https://worldcup-site-delta.vercel.app" >> $GITHUB_STEP_SUMMARY
